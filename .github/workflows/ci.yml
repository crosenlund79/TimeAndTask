name: CI

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TimeAndTask.slnx

      - name: Build
        run: dotnet build TimeAndTask.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution TimeAndTask.slnx -c Release --no-build

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish src/WorkTrace.App/WorkTrace.App.csproj -c Release -r win-x64 --self-contained false -o publish/WorkTrace

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WorkTrace-win-x64
          path: publish/WorkTrace
          retention-days: 14
